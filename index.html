<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ec">
  <title>合成EsiLA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="合成EsiLA首页"><img class="brand-mark" src="新建文件夹/11.jpg" alt="EsiLA"><span>合成EsiLA</span></a>
      <button class="icon-button" id="sound" aria-label="开启声音" title="开启声音">♪<span class="sound-status">关</span></button>
    </header>
    <section class="intro"><h1>小e，<span>大E</span></h1></section>
    <div class="play-layout">
      <aside class="left-panel">
        <section class="score-card"><div class="section-label">这一局的收获</div><div id="score" class="score-value" aria-live="polite">0</div><div class="best-row"><span>✦ 最佳纪录</span><strong id="best">0</strong></div></section>
        <button class="restart-button" id="restart"><span>↻</span> 重新来e局</button>
      </aside>
      <section class="game-column" aria-label="合成EsiLA游戏">
        <div class="game-toolbar"><span class="next-label">下一颗 <canvas id="next" width="64" height="64" aria-label="下一颗水果"></canvas></span></div>
        <div class="game-shell">
          <canvas id="game" width="430" height="710" tabindex="0" aria-label="游戏区域。左右方向键选择位置，空格或回车放下水果。"></canvas>
          <span class="danger-label">388</span>
          <div class="start-hint" id="start-hint"><span>↓</span> 点击这里，放下第e个</div>
          <div class="overlay" id="overlay" hidden><div class="result-card"><div class="eyebrow" id="result-label">每一颗都是小小的收获</div><h2 id="result-title">没品的东西...</h2><div class="result-score" id="result-score">0 <span>分</span></div><button class="primary-button" id="play-again">再来一局 →</button><button class="continue-button" id="continue" hidden>继续挑战</button></div></div>
        </div>
        <div class="game-footer"><span>✧ 慢慢来，总会合成的</span><span class="keyboard-tip">← → 移动 · 空格放下</span></div>
      </section>
      <aside class="right-panel"><section class="guide-card"><h2>e的合成顺序</h2><div id="fruit-guide" class="fruit-guide"></div><div class="guide-goal"><span>终极目标</span><strong>合成EsiLA</strong><span>✦</span></div></section></aside>
    </div>
  </main>
  <script src="physics.js"></script>
  <script src="game.js"></script>
</body>
</html>
